scheduleCopyAllReadyBlink();
}else if(!ready){
copyAllReadyBlinkState=false;
stopCopyAllReadyBlink();
}
}

maxVal=20.5;
}
}else if(state.mode==="clipless"){

maxVal=21;
}else{

}
}else if(state.mode==="w_clip"){

minVal=6;
maxVal=17;
}else{
minVal=6;
maxVal=18.5;
}
}else{
minVal=7;
maxVal=18.5;
}

function save(){
const toStore={
...state,
selectedColor:selectedColor,
historyOrder:state.historyOrder,
stitchType:stitchType
};
localStorage.setItem("psfs_v50_color",JSON.stringify(toStore));
}
let saveTimer=null;
function persistNow(){
if(saveTimer){
clearTimeout(saveTimer);
saveTimer=null;
}
save();
}
function scheduleSave(){
if(saveTimer)clearTimeout(saveTimer);
saveTimer=setTimeout(function(){
saveTimer=null;
save();
},250);
}
window.addEventListener("pagehide",persistNow);
function load(){
try{
const d=JSON.parse(localStorage.getItem("psfs_v50_color"));
if(d){
state.limit=d.limit||0;
state.used=d.used||0;
state.qty=d.qty||0;
state.mode=d.mode||null;
state.length=d.length||85;
state.dia=d.dia||7;
state.history=d.history||{};
state.historyOrder=d.historyOrder||[];
selectedColor=d.selectedColor!==undefined?d.selectedColor:null;
stitchType=d.stitchType!==undefined?d.stitchType:null;
}else{
selectedColor=null;
state.historyOrder=[];
stitchType=null;
}
if(selectedColor&&!COLOR_LIST.includes(selectedColor))selectedColor=null;
if(state.historyOrder){
state.historyOrder=state.historyOrder.filter(key=>state.history[key]);
}else{
state.historyOrder=[];
}
}catch(_){ selectedColor=null;state.historyOrder=[];stitchType=null;}
updateTitleColor();
updateStitchButtons();
}
load();
applyModeConstraints();
updateColorActiveUI();
updateStitchButtons();
let renderPending=false;
function scheduleRender(){
if(renderPending)return;
renderPending=true;
requestAnimationFrame(()=>{
renderPending=false;
render();
});
}
function commitSoftUpdate(){
scheduleRender();
scheduleSave();
}
function commitImmediateUpdate(options={}){
render(options);
persistNow();
}

function getDiameterText(){
if(!state.mode)return "Ø —";
const dc=diaCode(state.dia);
const diaNames=["Micro","Ultra Slim","Slim","Standard","Wide","Extra Wide","Ultra Wide"];
const idx=dc.charCodeAt(0)-65;
return diaNames[idx]||"—";
}
function getDiameterClass(){
if(!state.mode)return "tag";
const dc=diaCode(state.dia);
const idx=dc.charCodeAt(0)-65;
return "tag "+(["d1","d2","d3","d4","d5","d6","d7"][idx]||"tag");
}
function handleQtyChange(v){
if(state.limit===0){
toast(PSF_CONFIG.TEXT.SET_QTY_FIRST);
return;
}
if(state.mode===null){
toast("Select Clip Type first");
return;
}
if(!selectedColor){
showColorPickHint();
return;
}

if(state.used+next>state.limit){
toast(PSF_CONFIG.TEXT.LIMIT_REACHED);

}
state.qty=next;
commitSoftUpdate();
}
function qty(v){

function doSave(){
if(!selectedColor){
showColorPickHint();
return;
}
const code=toolCode();
const color=selectedColor;
const compositeKey=code+color;
if(!state.history[compositeKey]){
state.history[compositeKey]={
qty:0,
code:code,
color:color,
lengthVal:state.length,
diaVal:state.dia,
modeVal:state.mode,
stitchType:stitchType,
timestamp:Date.now()
};
state.historyOrder.push(compositeKey);
}else{
state.history[compositeKey].timestamp=Date.now();
const idx=state.historyOrder.indexOf(compositeKey);
if(idx!==-1)state.historyOrder.splice(idx,1);
state.historyOrder.push(compositeKey);
}
state.history[compositeKey].qty+=state.qty;
state.used+=state.qty;
c1.classList.remove("active");
c2.classList.remove("active");
c3.classList.remove("active");
state.mode=null;
stitchType=null;
selectedColor=null;
state.qty=0;
updateColorActiveUI();
updateTitleColor();
updateStitchButtons();
hideConfirm();
commitImmediateUpdate({ historyChanged:true});
toast(state.used+(state.used===1?" Fit Added":" Fits Added"));
if(isCopyAllReady())scheduleCopyAllReadyBlink();
}

function renderFinalState(options){

}

updateTitleColor();
updateStitchButtons();
}
function render(options={}){

function drawHistory(){
const hDiv=psfEl("history");
hDiv.innerHTML="";
const orderedKeys=state.historyOrder||[];
for(const key of orderedKeys){
const it=state.history[key];
if(!it)continue;
const d=document.createElement("div");
d.className="item";
const qtyVal=it.qty;
const lenVal=clean(it.lengthVal);
const diaVal=clean(it.diaVal);
const modeName=getModeDisplayName(it.modeVal);
const stitchName=it.stitchType?it.stitchType.charAt(0).toUpperCase()+it.stitchType.slice(1):"—";
const displayColorName=COLOR_DISPLAY_MAP[it.color]||it.color;
const colorHex=COLOR_TEXT_MAP[it.color]||PSF_CONFIG.COLORS.FALLBACK_TEXT;
const textSpan=document.createElement("span");
textSpan.className="item-code";
        textSpan.innerHTML = `
          ${it.code} × <span class="highlight-number">${qtyVal}</span>
          (L<span class="highlight-number">${lenVal}</span>-Ø<span class="highlight-number">${diaVal}</span>-
          <span class="highlight-number">${modeName}</span>-
          <span class="color-name-in-history" style="color: ${colorHex};">${displayColorName}</span>-
          <span class="highlight-number">${stitchName}</span>)
        `;
const delBtn=document.createElement("button");
delBtn.className="del";
delBtn.innerText="DEL";
delBtn.onclick=(e)=>{
e.stopPropagation();
showDeleteConfirm(key,it.qty);
};
d.appendChild(textSpan);
d.appendChild(delBtn);
hDiv.appendChild(d);
}
}
function copy(){
const totalUsed=Object.values(state.history).reduce((s,i)=>s+i.qty,0);
if(state.limit<=0){
toast(PSF_CONFIG.TEXT.SET_QTY_FIRST);
return;
}
if(totalUsed!==state.limit){
toast("Copy All available only when quota is fully used.");
return;
}
if(!Object.keys(state.history).length)return;
const entries=[];
for(const k in state.history){
const it=state.history[k];
const codeNum=parseInt(it.code,10);
entries.push({
codeNum:codeNum,
code:it.code,
qty:it.qty,
lengthVal:it.lengthVal,
diaVal:it.diaVal,
modeVal:it.modeVal,
stitchType:it.stitchType,
color:it.color
});
}

function cssProp(prop){
return prop.replace(/[A-Z]/g,function(m){ return "-"+m.toLowerCase();});
}
function setImportant(el,prop,value){
const name=cssProp(prop);
if(el.style.getPropertyValue(name)===value&&el.style.getPropertyPriority(name)==="important")return;
el.style.setProperty(name,value,"important");
}
function applyMap(el,map){
Object.keys(map).forEach(function(prop){ setImportant(el,prop,map[prop]);});
}
function clearOwnInline(el){

if(el.style.getPropertyValue(name))el.style.removeProperty(name);
});

function applyOne(el){

const isDisabledClass=el.classList.contains("disabled");
const isActive=el.classList.contains("active");

clearOwnInline(el);

}

}
el.dataset.psfDisabledFixApplied="1";
if(theme==="glass"){
applyMap(el,el.dataset.psfDisabledHover==="1"?greenHover:greenNormal);
}else{
applyMap(el,darkNormal);
}
}

<script id="psf-measurement-guide-script-v1">
(function(){
  'use strict';
  document.title='Fit v5.0';

  var GUIDE_PAGE_KEY='psfs_v50_guide_page';
  var GUIDE_MAX_PAGES=7;
  var guideToggle=document.getElementById('guideToggle');
  var guidePaginationCard=document.getElementById('guidePaginationCard');
  var guideCard=document.getElementById('guideCard');
  var guideHint=document.getElementById('guideHint');
  var guidePrev=document.getElementById('guidePrev');
  var guideNext=document.getElementById('guideNext');
  var guidePageNumbers=document.getElementById('guidePageNumbers');
  var guideStage=document.getElementById('guideStage');
  var guideStatus=document.getElementById('guideStatus');
  var guideImage=document.getElementById('guideImage');
  var titleHeading=document.querySelector('.topbar h1');
  if(!guideToggle||!guidePaginationCard||!guideCard||!guideHint||!titleHeading||!guidePrev||!guideNext||!guidePageNumbers||!guideStage||!guideStatus||!guideImage)return;

  var guideOpen=false;
  var guidePages=[];
  var guidePagesPromise=null;
  var guidePageIndex=readStoredPage();
  var guideImageRequest=0;
  var workflowScrollY=0;
  var titleFadeTimer=null;
  var GUIDE_MIN_SCALE=1;
  var GUIDE_MAX_SCALE=3;
  var GUIDE_DOUBLE_TAP_SCALE=2;
  var guideScale=1;
  var guidePanX=0;
  var guidePanY=0;
  var guideGesture='none';
  var guideGestureStartX=0;
  var guideGestureStartY=0;
  var guideGestureOriginX=0;
  var guideGestureOriginY=0;
  var guideGestureMoved=false;
  var guideGestureStartedAt=0;
  var guidePinchStartDistance=0;
  var guidePinchStartScale=1;
  var guidePinchImageX=0;
  var guidePinchImageY=0;
  var lastGuideTapTime=0;
  var lastGuideTapX=0;
  var lastGuideTapY=0;
  var lastGuideTouchTime=0;
  var guideZoomAnimationTimer=null;
  var guideMousePanning=false;

  function readStoredPage(){
    try{
      var value=parseInt(localStorage.getItem(GUIDE_PAGE_KEY),10);
      return Number.isFinite(value)&&value>=0?value:0;
    }catch(_){
      return 0;
    }
  }

  function storePage(){
    try{
      localStorage.setItem(GUIDE_PAGE_KEY,String(guidePageIndex));
    }catch(_){ }
  }

  function probeWithImage(url){
    return new Promise(function(resolve){
      var probe=new Image();
      probe.onload=function(){ resolve(true); };
      probe.onerror=function(){ resolve(false); };
      probe.src=url;
    });
  }

  function probeGuide(url){
    if(location.protocol!=='http:'&&location.protocol!=='https:')return probeWithImage(url);
    return fetch(url,{ method:'HEAD',cache:'force-cache' }).then(function(response){
      if(response.ok)return true;
      if(response.status===404)return false;
      return probeWithImage(url);
    }).catch(function(){
      return probeWithImage(url);
    });
  }

  function discoverGuidePages(){
    if(guidePagesPromise)return guidePagesPromise;
    var candidates=[];
    for(var i=1;i<=GUIDE_MAX_PAGES;i++)candidates.push('images/Guide'+i+'.webp');
    guidePagesPromise=Promise.all(candidates.map(function(url){
      return probeGuide(url).then(function(found){ return found?url:null; });
    })).then(function(results){
      guidePages=results.filter(Boolean);
      if(guidePages.length){
        guidePageIndex=Math.min(guidePageIndex,guidePages.length-1);
        storePage();
      }else{
        guidePageIndex=0;
      }
      renderPagination();
      return guidePages;
    });
    return guidePagesPromise;
  }

  function renderPagination(){
    guidePageNumbers.innerHTML='';
    guidePages.forEach(function(_,index){
      var button=document.createElement('button');
      button.type='button';
      button.className='guide-page-button'+(index===guidePageIndex?' active':'');
      button.textContent=String(index+1);
      button.setAttribute('aria-label','Open guide page '+(index+1));
      if(index===guidePageIndex)button.setAttribute('aria-current','page');
      button.addEventListener('click',function(){ changeGuidePage(index); });
      guidePageNumbers.appendChild(button);
    });
    guidePrev.disabled=!guidePages.length||guidePageIndex<=0;
    guideNext.disabled=!guidePages.length||guidePageIndex>=guidePages.length-1;
  }

  function preloadAdjacentPages(){
    [guidePageIndex-1,guidePageIndex+1].forEach(function(index){
      if(index<0||index>=guidePages.length)return;
      var preload=new Image();
      preload.src=guidePages[index];
    });
  }

  function clampGuideValue(value,min,max){
    return Math.max(min,Math.min(max,value));
  }

  function guideTouchDistance(touches){
    var dx=touches[1].clientX-touches[0].clientX;
    var dy=touches[1].clientY-touches[0].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function guideTouchMidpoint(touches){
    return {
      x:(touches[0].clientX+touches[1].clientX)/2,
      y:(touches[0].clientY+touches[1].clientY)/2
    };
  }

  function clampGuidePan(scale,x,y){
    var imageWidth=guideImage.clientWidth;
    var imageHeight=guideImage.clientHeight;
    var stageWidth=guideStage.clientWidth;
    var stageHeight=guideStage.clientHeight;
    if(!imageWidth||!imageHeight||!stageWidth||!stageHeight)return { x:0,y:0 };
    var minX=Math.min(0,stageWidth-imageWidth*scale);
    var minY=Math.min(0,stageHeight-imageHeight*scale);
    return {
      x:clampGuideValue(x,minX,0),
      y:clampGuideValue(y,minY,0)
    };
  }

  function setGuideZoom(scale,x,y,animate){
    scale=clampGuideValue(scale,GUIDE_MIN_SCALE,GUIDE_MAX_SCALE);
    if(scale<1.01){
      scale=1;
      x=0;
      y=0;
    }
    var pan=clampGuidePan(scale,x,y);
    guideScale=scale;
    guidePanX=pan.x;
    guidePanY=pan.y;
    window.clearTimeout(guideZoomAnimationTimer);
    guideStage.classList.toggle('guide-zoomed',guideScale>1.01);
    guideStage.classList.toggle('guide-zoom-animate',!!animate);
    guideImage.style.transform='translate3d('+guidePanX+'px,'+guidePanY+'px,0) scale('+guideScale+')';
    if(animate){
      guideZoomAnimationTimer=window.setTimeout(function(){
        guideStage.classList.remove('guide-zoom-animate');
      },280);
    }
  }

  function resetGuideZoom(animate){
    guideGesture='none';
    guideMousePanning=false;
    guideStage.classList.remove('guide-panning');
    lastGuideTapTime=0;
    setGuideZoom(1,0,0,!!animate);
  }

  function zoomGuideAt(targetScale,clientX,clientY,animate){
    var rect=guideStage.getBoundingClientRect();
    var pointX=clientX-rect.left;
    var pointY=clientY-rect.top;
    var imageX=(pointX-guidePanX)/guideScale;
    var imageY=(pointY-guidePanY)/guideScale;
    var nextPanX=pointX-imageX*targetScale;
    var nextPanY=pointY-imageY*targetScale;
    setGuideZoom(targetScale,nextPanX,nextPanY,!!animate);
  }

  function toggleGuideZoom(clientX,clientY){
    if(!guideImage.classList.contains('ready'))return;
    if(guideScale>1.01)resetGuideZoom(true);
    else zoomGuideAt(GUIDE_DOUBLE_TAP_SCALE,clientX,clientY,true);
  }

  function beginGuideSingleTouch(touch,forceMoved){
    guideGesture=guideScale>1.01?'pan':'swipe';
    guideGestureStartX=touch.clientX;
    guideGestureStartY=touch.clientY;
    guideGestureOriginX=guidePanX;
    guideGestureOriginY=guidePanY;
    guideGestureMoved=!!forceMoved;
    guideGestureStartedAt=Date.now();
    guideStage.classList.toggle('guide-panning',guideGesture==='pan');
  }

  function beginGuidePinch(touches){
    var midpoint=guideTouchMidpoint(touches);
    var rect=guideStage.getBoundingClientRect();
    var pointX=midpoint.x-rect.left;
    var pointY=midpoint.y-rect.top;
    guideGesture='pinch';
    guideGestureMoved=true;
    guidePinchStartDistance=Math.max(1,guideTouchDistance(touches));
    guidePinchStartScale=guideScale;
    guidePinchImageX=(pointX-guidePanX)/guideScale;
    guidePinchImageY=(pointY-guidePanY)/guideScale;
    lastGuideTapTime=0;
    guideStage.classList.add('guide-panning');
    guideStage.classList.remove('guide-zoom-animate');
  }

  function registerGuideTap(touch,event){
    var now=Date.now();
    var dx=touch.clientX-lastGuideTapX;
    var dy=touch.clientY-lastGuideTapY;
    if(lastGuideTapTime&&now-lastGuideTapTime<=360&&Math.sqrt(dx*dx+dy*dy)<=32){
      if(event&&event.cancelable)event.preventDefault();
      lastGuideTapTime=0;
      toggleGuideZoom(touch.clientX,touch.clientY);
      return;
    }
    lastGuideTapTime=now;
    lastGuideTapX=touch.clientX;
    lastGuideTapY=touch.clientY;
  }

  function showGuidePage(){
    resetGuideZoom(false);
    renderPagination();
    if(!guidePages.length){
      guideImageRequest++;
      guideImage.removeAttribute('src');
      guideImage.classList.remove('ready');
      guideImage.alt='';
      guideStatus.hidden=false;
      guideStatus.textContent='No guide images found in the images folder.';
      return;
    }
    var requestId=++guideImageRequest;
    guideStatus.hidden=false;
    guideStatus.textContent='Loading guide…';
    guideImage.classList.remove('ready');
    guideImage.alt='';
    guideImage.onload=function(){
      if(requestId!==guideImageRequest)return;
      guideStatus.hidden=true;
      guideImage.classList.add('ready');
      guideImage.alt='Measurement guide page '+(guidePageIndex+1)+' of '+guidePages.length;
      preloadAdjacentPages();
    };
    guideImage.onerror=function(){
      if(requestId!==guideImageRequest)return;
      guideImage.classList.remove('ready');
      guideStatus.hidden=false;
      guideStatus.textContent='This guide page could not be loaded.';
    };
    guideImage.src=guidePages[guidePageIndex];
  }

  function changeGuidePage(index){
    if(!guidePages.length)return;
    var next=Math.max(0,Math.min(index,guidePages.length-1));
    if(next===guidePageIndex)return;
    resetGuideZoom(false);
    guidePageIndex=next;
    storePage();
    showGuidePage();
  }

  function showGuideHint(message){
    window.clearTimeout(titleFadeTimer);
    titleHeading.classList.remove('psf-guide-title-fade');
    guideHint.textContent=message;
    titleHeading.classList.add('psf-guide-title-hint');
    guideHint.classList.remove('show','psf-guide-hint-fade-out');
    void guideHint.offsetWidth;
    guideHint.classList.add('show');
  }

  function restoreGuideTitle(withFade){
    window.clearTimeout(titleFadeTimer);
    guideHint.classList.remove('show','psf-guide-hint-fade-out');
    titleHeading.classList.remove('psf-guide-title-hint');
    titleHeading.querySelectorAll('.title-desktop,.title-mobile').forEach(function(part){
      part.textContent='✒️Fit v5.0';
    });
    titleHeading.classList.remove('psf-guide-title-fade');
    if(withFade){
      void titleHeading.offsetWidth;
      titleHeading.classList.add('psf-guide-title-fade');
      titleFadeTimer=window.setTimeout(function(){
        titleHeading.classList.remove('psf-guide-title-fade');
      },1400);
    }
  }

  function openGuide(){
    if(guideOpen)return;
    guideOpen=true;
    workflowScrollY=window.scrollY||window.pageYOffset||0;
    document.body.classList.add('guide-open');
    guidePaginationCard.setAttribute('aria-hidden','false');
    guideCard.setAttribute('aria-hidden','false');
    guideToggle.classList.add('active');
    guideToggle.setAttribute('aria-pressed','true');
    guideToggle.setAttribute('aria-label','Close measurement guide');
    requestAnimationFrame(function(){
      window.scrollTo({ top:0,left:0,behavior:'auto' });
      showGuideHint('Tap Guide to return →');
    });
    discoverGuidePages().then(function(){
      if(guideOpen)showGuidePage();
    });
  }

  function closeGuide(){
    if(!guideOpen)return;
    guideOpen=false;
    guideImageRequest++;
    resetGuideZoom(false);
    restoreGuideTitle(true);
    document.body.classList.remove('guide-open');
    guidePaginationCard.setAttribute('aria-hidden','true');
    guideCard.setAttribute('aria-hidden','true');
    guideToggle.classList.remove('active');
    guideToggle.setAttribute('aria-pressed','false');
    guideToggle.setAttribute('aria-label','Open measurement guide');
    requestAnimationFrame(function(){
      window.scrollTo({ top:workflowScrollY,left:0,behavior:'auto' });
    });
  }

  guideToggle.addEventListener('click',function(){
    if(guideOpen)closeGuide();
    else openGuide();
  });
  guidePrev.addEventListener('click',function(){ changeGuidePage(guidePageIndex-1); });
  guideNext.addEventListener('click',function(){ changeGuidePage(guidePageIndex+1); });
  guideHint.addEventListener('animationend',function(event){
    if(event.animationName==='psfGuideHintBlink'){
      guideHint.classList.add('psf-guide-hint-fade-out');
    }else if(event.animationName==='psfGuideHintFadeOut'){
      restoreGuideTitle(true);
    }
  });

  guideStage.addEventListener('touchstart',function(event){
    if(!guideOpen||!guideImage.classList.contains('ready'))return;
    guideStage.classList.remove('guide-zoom-animate');
    if(event.touches.length>=2){
      if(event.cancelable)event.preventDefault();
      beginGuidePinch(event.touches);
      return;
    }
    if(event.touches.length===1)beginGuideSingleTouch(event.touches[0],false);
  },{ passive:false });

  guideStage.addEventListener('touchmove',function(event){
    if(!guideOpen||!guideImage.classList.contains('ready'))return;
    if(event.touches.length>=2){
      if(guideGesture!=='pinch')beginGuidePinch(event.touches);
      if(event.cancelable)event.preventDefault();
      var midpoint=guideTouchMidpoint(event.touches);
      var rect=guideStage.getBoundingClientRect();
      var nextScale=clampGuideValue(guidePinchStartScale*(guideTouchDistance(event.touches)/guidePinchStartDistance),GUIDE_MIN_SCALE,GUIDE_MAX_SCALE);
      var pointX=midpoint.x-rect.left;
      var pointY=midpoint.y-rect.top;
      setGuideZoom(nextScale,pointX-guidePinchImageX*nextScale,pointY-guidePinchImageY*nextScale,false);
      return;
    }
    if(event.touches.length!==1)return;
    var touch=event.touches[0];
    var dx=touch.clientX-guideGestureStartX;
    var dy=touch.clientY-guideGestureStartY;
    if(Math.abs(dx)>6||Math.abs(dy)>6)guideGestureMoved=true;
    if(guideGesture==='pan'&&guideScale>1.01){
      if(event.cancelable)event.preventDefault();
      setGuideZoom(guideScale,guideGestureOriginX+dx,guideGestureOriginY+dy,false);
    }
  },{ passive:false });

  guideStage.addEventListener('touchend',function(event){
    lastGuideTouchTime=Date.now();
    if(guideGesture==='pinch'){
      if(event.touches.length===1){
        beginGuideSingleTouch(event.touches[0],true);
      }else{
        guideGesture='none';
        guideStage.classList.remove('guide-panning');
        if(guideScale<1.01)resetGuideZoom(true);
      }
      return;
    }
    if(event.touches.length||!event.changedTouches.length)return;
    var touch=event.changedTouches[0];
    var dx=touch.clientX-guideGestureStartX;
    var dy=touch.clientY-guideGestureStartY;
    var gesture=guideGesture;
    var moved=guideGestureMoved||Math.abs(dx)>10||Math.abs(dy)>10;
    guideGesture='none';
    guideStage.classList.remove('guide-panning');
    if(gesture==='swipe'&&guideScale<=1.01&&Math.abs(dx)>=45&&Math.abs(dx)>Math.abs(dy)*1.2){
      if(dx<0)changeGuidePage(guidePageIndex+1);
      else changeGuidePage(guidePageIndex-1);
      return;
    }
    if(!moved&&Date.now()-guideGestureStartedAt<=360)registerGuideTap(touch,event);
  },{ passive:false });

  guideStage.addEventListener('touchcancel',function(){
    guideGesture='none';
    guideStage.classList.remove('guide-panning');
  },{ passive:true });

  guideStage.addEventListener('dblclick',function(event){
    if(!guideOpen||Date.now()-lastGuideTouchTime<700)return;
    event.preventDefault();
    toggleGuideZoom(event.clientX,event.clientY);
  });

  guideStage.addEventListener('mousedown',function(event){
    if(!guideOpen||guideScale<=1.01||event.button!==0)return;
    guideMousePanning=true;
    guideGestureStartX=event.clientX;
    guideGestureStartY=event.clientY;
    guideGestureOriginX=guidePanX;
    guideGestureOriginY=guidePanY;
    guideStage.classList.add('guide-panning');
    guideStage.classList.remove('guide-zoom-animate');
    event.preventDefault();
  });

  window.addEventListener('mousemove',function(event){
    if(!guideMousePanning)return;
    setGuideZoom(guideScale,guideGestureOriginX+event.clientX-guideGestureStartX,guideGestureOriginY+event.clientY-guideGestureStartY,false);
  });

  window.addEventListener('mouseup',function(){
    if(!guideMousePanning)return;
    guideMousePanning=false;
    guideStage.classList.remove('guide-panning');
  });

  window.addEventListener('resize',function(){
    if(guideScale<=1.01)return;
    requestAnimationFrame(function(){ setGuideZoom(guideScale,guidePanX,guidePanY,false); });
  });

  showGuideHint('Tap Guide to view →');
})();
</script>

</body>
</html>
