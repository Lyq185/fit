html body .guide-hint.show {

}

@media (max-width: 380px) {

    width: 28px;

  }

/* Guide refinement: separate page controls, exact-fit image card, fine texture. */
html body #guidePaginationCard#guidePaginationCard {
  display: none;

  border: 1.5px solid rgba(214,166,103,.95) !important;
  border-radius: 18px !important;
}

  display: block !important;
}
html body #guidePaginationCard .guide-pagination {
  margin: 0 !important;
}
html body #guideCard#guideCard {
  padding: 0 !important;
  min-height: 0 !important;

  overflow: hidden !important;

  min-height: 0 !important;
  line-height: 0 !important;
}
html body #guideCard #guideImage {
  display: none;
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  vertical-align: top !important;
}
html body #guideCard #guideImage.ready {
  display: block !important;
}
html body #guideCard .guide-status[hidden] {
  display: none !important;
}
html body[data-theme="green"].card-texture-loaded #guidePaginationCard#guidePaginationCard,
html body[data-theme="green"].card-texture-loaded #guideCard#guideCard {
  background-repeat: no-repeat,repeat !important;

  background-size: auto,336px 336px !important;
}
html body[data-theme="dark"].dark-card-texture-loaded #guidePaginationCard#guidePaginationCard,

  background-size: auto,auto,336px 336px !important;
}
html body h1 #guideHint#guideHint {

  position: static !important;
  inset: auto !important;
  z-index: auto !important;
  width: auto !important;
  inline-size: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  height: auto !important;

  margin: 0 !important;

  margin-right: -4px !important;
  overflow: hidden !important;
  text-align: right !important;

html body h1.psf-guide-title-hint #guideHint#guideHint.show {
  display: inline-block !important;
  visibility: visible !important;
  max-width: 100% !important;
  vertical-align: middle !important;
  text-align: right !important;
