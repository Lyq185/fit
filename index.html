<body data-theme="glass">
<div class="app">
  <header class="topbar" aria-label="App header">
    <h1><span class="title-desktop">✒️Sleeve Fit v5.0</span><span class="title-mobile">Pen Sleeve Fit v5.0</span></h1>
    <nav class="theme-switch" aria-label="Theme switcher">
      <button id="themeGlassBtn" class="theme-dot theme-dot-glass active" type="button" data-theme="glass" aria-label="Glass" aria-pressed="true"></button>
      <button id="themeDarkBtn" class="theme-dot theme-dot-dark" type="button" data-theme="dark" aria-label="Dark" aria-pressed="false"></button>
      <button id="themeGreenBtn" class="theme-dot theme-dot-green" type="button" data-theme="green" aria-label="Green" aria-pressed="false"></button>
    </nav>
  </header>
  <div class="card">
    <div class="first-row">
      <div class="capsule-stepper" id="qtyStepper" style="margin:0;">
        <button onclick="setLimit(-1)">–</button>
        <span class="value" id="limitVal">0</span>
        <button onclick="setLimit(1)">+</button>
      </div>
      <div class="stitch-group">
        <button class="stitch-btn disabled" id="crossBtn" onclick="selectStitch('cross')">Cross</button>
        <button class="stitch-btn disabled" id="saddleBtn" onclick="selectStitch('saddle')">Saddle</button>
      </div>
    </div>
  </div>
  <div class="card">
    <input type="range" id="D" min="7" max="18.5" step="0.1" value="7">
    <div style="margin-top:12px;">
      <div class="stepper-row">
        <div class="switch" style="margin:0;gap:12px;">
          <button id="c1" onclick="mode('clipless')">N</button>
          <button id="c2" onclick="mode('clipped')">S</button>
          <button id="c3" onclick="mode('w_clip')">W</button>
        </div>
        <div class="capsule-stepper" style="margin:0;">
          <button id="diaMinusBtn" onclick="diaStep(-0.1)">–</button>
          <span class="value" id="Dv">7.0</span>
          <button id="diaPlusBtn" onclick="diaStep(0.1)">+</button>
        </div>
      </div>
    </div>
    <div class="tag" id="Dc" style="margin-top:12px;text-align:center;"></div>
  </div>
  <div class="card">
    <input type="range" min="85" max="165" step="1" value="85" id="L">
    <div class="stepper-row" style="margin-top:12px;">
      <div class="stepper-label">📏 Length</div>
      <div class="capsule-stepper" style="margin:0;">
        <button onclick="lenStep(-0.1)">–</button>
        <span class="value" id="Lv">85.0</span>
        <button onclick="lenStep(0.1)">+</button>
      </div>
    </div>
    <div class="tag" id="Lc" style="margin-top:12px;text-align:center;"></div>
  </div>
  <div class="card" id="colorCard">
    <div class="color-module-row">
      <div class="color-label" id="colorLabel">
        <span class="color-label-icon">🎨</span>
        <span class="color-label-text" id="leatherLabelText">Leather</span>
      </div>
      <div class="color-chips-group" id="colorChipsGroup">
        <div class="color-chip" data-color="Bottiglia" style="background-color: #2e8b57;">
          <img src="images/Bottiglia.png" alt="Bottiglia" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #2e8b57;">Bottle Green</span>
        </div>
        <div class="color-chip" data-color="Napoli" style="background-color: #e5c07b;">
          <img src="images/Napoli.png" alt="Napoli" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #e5c07b;">Naples Yellow</span>
        </div>
        <div class="color-chip" data-color="Nero" style="background-color: #4a4a4a;">
          <img src="images/Nero.png" alt="Nero" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #4a4a4a;">Nero</span>
        </div>
        <div class="color-chip" data-color="Papavero" style="background-color: #e34234;">
          <img src="images/Papavero.png" alt="Papavero" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #e34234;">Poppy Red</span>
        </div>
      </div>
    </div>
  </div>
  <div class="card" id="previewCard">
    <div class="stepper-row">
      <div class="stepper-label">
        <label style="font-size:20px;">✨ Preview</label>
        <div class="big" id="previewCount" style="font-size:22px; display:inline-block; margin-left:6px;"></div>
      </div>
      <div class="capsule-stepper" style="margin:0;">
        <button id="qtyMinusBtn" class="qty-control-btn" onclick="handleQtyChange(-1)">–</button>
        <span class="value" id="q">0</span>
        <button id="qtyPlusBtn" class="qty-control-btn" onclick="handleQtyChange(1)">+</button>
      </div>
    </div>
    <div id="preview" style="font-size:26px; word-break:break-word;"></div>
  </div>
  <div id="historyPanel">
    <div id="history"></div>
  </div>
  <div class="bottom">
    <div class="bottom-container">
      <div class="bottom-buttons">
        <button id="genBtn" onclick="showConfirm()">Save</button>
        <button id="copyBtn" onclick="copy()" disabled>Copy All</button>
        <button id="clearBtn" onclick="showClearConfirm()">Clear</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="confirmPanel">
    <div id="confirmBox">
      <div id="confirmText"></div>
      <div id="confirmHint">Please Confirm</div>
      <div class="confirm-btns">
        <button id="confirmCancel" onclick="hideConfirm()">Cancel</button>
        <button id="confirmSave" onclick="doSave()">Save</button>
      </div>
    </div>
  </div>
  <div id="clearConfirmPanel">
    <div id="clearConfirmBox">
      <div id="clearConfirmText">Clear all data?</div>
      <div class="clear-confirm-btns">
        <button id="clearConfirmCancel" onclick="hideClearConfirm()">Cancel</button>
        <button id="clearConfirmOK" onclick="doClear()">OK</button>
      </div>
    </div>
  </div>
  <div id="deleteConfirmPanel">
    <div id="deleteConfirmBox">
      <div id="deleteConfirmText">Delete Config?</div>
      <div class="delete-confirm-btns">
        <button id="deleteConfirmCancel" onclick="hideDeleteConfirm()">Cancel</button>
        <button id="deleteConfirmOK" onclick="doDelete()">Delete</button>
      </div>
    </div>
  </div>
